<!DOCTYPE html>
<html lang="en">
<head>
    <base href="./">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="static/images/ppshlatest.png" type="image/icon type">
    <title>Feedback Saved Locally</title>
    <link rel="stylesheet" href="static/css/global.css">
    <style>
        body {
            font-family: 'Lato', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f1f4f6;
        }
        .message-card {
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 420px;
        }
        h1 {
            margin-top: 0;
        }
        p {
            color: #35525b;
        }
        a {
            color: #045762;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="message-card">
        <h1>Thank You!</h1>
        <p>Your message has been saved locally in your browser so you can refer back to it. Because GitHub Pages is static-only, we recommend sharing any critical feedback directly with your teacher as well.</p>
        <p><a href="contact.html">Return to the feedback form</a></p>
    </div>
</body>
</html>
